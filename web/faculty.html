    <h1>导师</h1>
    <p class="lede">校级研招网只告诉你「怎么报名」，<strong>院系师资页才告诉你「这个方向要不要我」</strong>。研究方向是判断契合度唯一的依据，所以这一页的信息密度全压在它上面。</p>

    <p>页面里没写研究方向的导师，一律显示「该导师页面没有研究方向」并排到后面——没有方向就判断不了契合度，我们不替他编一个；没抽到邮箱的显示核对提示，不留白。</p>
