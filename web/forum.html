<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>论坛 · 推免雷达</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%232c53c8' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%232c53c8'/%3E%3C/svg%3E">
</head>
<body>
<div class="page">

  <header class="hero">
    <div class="brand"><span class="logo">◎</span> 推免雷达 <span class="brand-sub">tuimian radar</span></div>
    <nav class="nav">
      <a href="index.html">匹配结果</a>
      <a href="notices.html">公告</a>
      <a href="faculty.html">导师</a>
      <a href="forum.html" aria-current="page">论坛</a>
      <a href="daily.html">今日更新</a>
      <a href="subscriptions.html">我的订阅</a>
      <a href="pricing.html">订阅</a>
    </nav>
    <h1>论坛</h1>
    <p class="lede">问经验、看实验室锐评。这里<strong>后台实名、前台匿名代号</strong>——代号由服务端派生而且固定，别人认不出你，但平台在收到合法通知时能定位到责任人。</p>
  </header>

  <div id="compliance"></div>

  <section id="postbox-wrap" class="panel" hidden>
    <div id="postbox"></div>
  </section>

  <div id="toolbar" class="toolbar" hidden>
    <input id="q" class="search" type="search" autocomplete="off" placeholder="搜标题或正文，如「套磁」「六级」">
    <label class="pick">院系<select id="unit"></select></label>
    <label class="pick">标签<select id="tag"></select></label>
    <span id="result-count" class="count"></span>
  </div>

  <main id="results"></main>

  <!-- 「我的举报」：本地记着我举报过哪些帖（服务端也去重），逐条问
       GET /api/posts/{id}/moderation 拿处置结果。
       **只显示"结果"，不显示"举报人是谁"** —— 接口按关系裁剪，作者才看得到依据类别。 -->
  <section id="my-reports-wrap" class="panel my-reports" hidden>
    <div class="panel-head">
      <h2 class="panel-title">我的举报</h2>
      <span id="my-reports-count" class="hist-range"></span>
      <button type="button" id="my-reports-refresh" class="btn-ghost btn-mini">刷新状态</button>
    </div>
    <div id="my-reports"></div>
  </section>

  <div id="state" class="state">正在读取数据…</div>

  <footer class="foot">
    <p>数据源：<code id="api-source">读取中…</code>（<code>GET /api/posts</code> 的形状）。</p>
    <p>前台只渲染 9 个公开字段；<code>author_real_id</code> / <code>created_ip</code> / <code>review_status</code>
       只在服务端存储、只在审核后台出现。被举报累计 3 个不同举报人后自动进审核队列，前台不再显示。</p>
  </footer>

</div>
<script src="assets/common.20261020d.js"></script>
<!-- 契约漂移面板：必须在页面取数**之前**加载，它靠包 apiGet/apiPost 记录载荷 -->
<script src="assets/drift.js"></script>
<script src="assets/forum.js"></script>
<script src="assets/notify.js"></script>
</body>
</html>
